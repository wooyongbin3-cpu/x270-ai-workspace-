# Tox configuration — run the full quality matrix locally
# Usage: tox  (or: tox -e py311)

[tox]
envlist = py310, py311, py312, py313, lint, typecheck
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run the test suite with coverage
deps =
    pytest>=7.4
    pytest-cov>=4.1
    pytest-mock>=3.12
commands =
    pytest --cov=chronolock --cov-report=term-missing {posargs}

[testenv:lint]
description = Run the ruff linter
deps = ruff>=0.3
commands = ruff check .

[testenv:typecheck]
description = Run mypy static type checking
deps = mypy>=1.8
commands = mypy src