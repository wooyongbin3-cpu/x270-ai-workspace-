[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightcat"
version = "0.1.0"
description = "守夜貓：替家裡的小伺服器守夜。磁碟、溫度、電池、備份、服務出狀況就用 Telegram 通知你。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ybwoo" }]
keywords = ["monitoring", "homelab", "self-hosted", "telegram", "backup", "battery"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
# 3.11 以上只用標準庫；3.10 需要 tomli 來讀 TOML
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
# Windows / macOS 沒有 /proc，記憶體、負載、電池要靠 psutil
psutil = ["psutil>=5.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "mypy>=1.8", "ruff>=0.3"]

[project.scripts]
nightcat = "nightcat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["psutil", "tomli"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
