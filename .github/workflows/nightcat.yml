name: nightcat

on:
  push:
    branches: [main]
    paths: ["projects/nightcat/**", ".github/workflows/nightcat.yml"]
  pull_request:
    paths: ["projects/nightcat/**", ".github/workflows/nightcat.yml"]

defaults:
  run:
    working-directory: projects/nightcat

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/nightcat/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov=nightcat --cov-report=term-missing

  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/nightcat/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
